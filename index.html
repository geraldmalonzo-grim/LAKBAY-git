<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>LAKBAY — Rizal's Journey to Heroism</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ivory: #f3efe4;
        --green: #193d32;
        --ink: #142d27;
        --gray: #56615b;
        --terra: #a5472a;
        --paper: #e4dcc8;
        --bg: var(--ivory);
        --fg: var(--ink);
        --card: var(--paper);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f241e;
          --fg: #f3efe4;
          --card: #193d32;
          --gray: #b5bfb7;
          --terra: #e08a68;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0f241e;
        --fg: #f3efe4;
        --card: #193d32;
        --gray: #b5bfb7;
        --terra: #e08a68;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: 70px;
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          17px/1.65 "DM Sans",
          system-ui,
          sans-serif;
      }
      h1,
      h2,
      h3,
      .serif {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 700;
        line-height: 1.05;
        margin: 0;
      }
      a {
        color: var(--terra);
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--terra);
        outline-offset: 2px;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        border-bottom: 1px solid var(--gray);
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 5vw;
      }
      .mark {
        font-family: "Cormorant Garamond", serif;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.14em;
        text-decoration: none;
        color: var(--fg);
      }
      .mark small {
        display: block;
        font: 12px "DM Sans";
        letter-spacing: 0;
        color: var(--gray);
      }
      .sp {
        flex: 1;
      }
      .btn {
        border: 1px solid var(--fg);
        background: none;
        padding: 8px 16px;
        border-radius: 2px;
      }
      .btn:hover,
      .btn.on {
        background: var(--green);
        color: var(--ivory);
      }
      .btn.pri {
        background: var(--terra);
        border-color: var(--terra);
        color: #fff;
        font-weight: 700;
        padding: 12px 24px;
        text-decoration: none;
        display: inline-block;
      }
      #prog {
        height: 3px;
        background: var(--terra);
        width: 0;
        position: absolute;
        left: 0;
        bottom: -1px;
        transition: width 0.4s;
      }
      #menu {
        display: none;
        position: fixed;
        inset: 56px 0 0 0;
        background: var(--bg);
        z-index: 4;
        padding: 24px 5vw;
        overflow: auto;
      }
      #menu.open {
        display: block;
      }
      #menu a {
        display: flex;
        gap: 16px;
        padding: 12px 0;
        border-bottom: 1px solid var(--gray);
        text-decoration: none;
        color: var(--fg);
        font-family: "Cormorant Garamond", serif;
        font-size: 26px;
        font-weight: 700;
      }
      #menu a.cur {
        color: var(--terra);
      }
      #menu a i {
        font: normal 14px "DM Sans";
        color: var(--gray);
        align-self: center;
        margin-left: auto;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 5vw 80px;
      }
      .hero {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 5vw;
        padding: 7vh 0;
        align-items: end;
      }
      .hero h1 {
        font-size: clamp(64px, 14vw, 170px);
        letter-spacing: 0.04em;
        color: var(--green);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .hero h1 {
          color: var(--ivory);
        }
      }
      .sub {
        font:
          italic 500 clamp(22px, 3vw, 34px)/1.2 "Cormorant Garamond",
          serif;
      }
      .ph {
        aspect-ratio: 3/4;
        background: repeating-linear-gradient(
          45deg,
          var(--card),
          var(--card) 8px,
          transparent 8px,
          transparent 16px
        );
        border: 1px solid var(--gray);
        display: grid;
        place-items: center;
        text-align: center;
        padding: 20px;
        font-size: 14px;
        color: var(--gray);
      }
      .path {
        border-left: 2px dotted var(--terra);
        margin: 0 0 0 8px;
        padding-left: 5vw;
      }
      h2 {
        font-size: clamp(36px, 6vw, 64px);
        margin: 10px 0 16px;
      }
      h3 {
        font-size: 28px;
        margin: 28px 0 6px;
      }
      .tl {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 8px 0;
        border-bottom: 1px solid var(--gray);
      }
      .tl button,
      .tabs button {
        border: 0;
        border-bottom: 3px solid transparent;
        background: none;
        padding: 8px 12px;
        white-space: nowrap;
      }
      .tl button[aria-pressed="true"],
      .tabs button[aria-pressed="true"] {
        border-color: var(--terra);
        font-weight: 700;
      }
      .panel {
        background: var(--card);
        padding: 24px;
        margin: 16px 0;
        border-left: 4px solid var(--terra);
      }
      .panel h3 {
        margin-top: 0;
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        border-bottom: 1px solid var(--gray);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 0;
        border-top: 1px solid var(--gray);
      }
      .grid a {
        padding: 18px 8px 18px 0;
        border-bottom: 1px solid var(--gray);
        text-decoration: none;
        color: var(--fg);
        display: block;
      }
      .grid a:hover h3 {
        color: var(--terra);
      }
      .grid h3 {
        margin: 0;
        font-size: 26px;
      }
      .grid small {
        color: var(--gray);
      }
      .seen {
        color: var(--terra);
      }
      .lede {
        font:
          italic 500 clamp(22px, 3vw, 30px)/1.3 "Cormorant Garamond",
          serif;
        max-width: 30ch;
        margin: 0 0 20px;
      }
      .cols {
        columns: 2 320px;
        column-gap: 48px;
      }
      .cols h3 {
        break-after: avoid;
        margin-top: 0;
      }
      .sec {
        break-inside: avoid;
        margin-bottom: 24px;
      }
      details {
        border: 1px solid var(--gray);
        padding: 12px 18px;
        margin: 20px 0;
      }
      summary {
        cursor: pointer;
        font-weight: 700;
      }
      textarea {
        width: 100%;
        min-height: 110px;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--fg);
        padding: 12px;
        font: inherit;
      }
      .nav2 {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 48px;
        border-top: 1px solid var(--gray);
        padding-top: 20px;
        flex-wrap: wrap;
      }
      .chain {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 16px 0;
      }
      .chain button {
        border: 1px solid var(--fg);
        background: none;
        padding: 6px 14px;
      }
      .chain button[aria-pressed="true"] {
        background: var(--green);
        color: var(--ivory);
      }
      .src li {
        margin-bottom: 12px;
      }
      .small {
        font-size: 14px;
        color: var(--gray);
      }
      #top {
        position: fixed;
        right: 16px;
        bottom: 16px;
        display: none;
        background: var(--green);
        color: var(--ivory);
        border: 0;
        padding: 10px 14px;
      }
      @media (max-width: 760px) {
        .hero {
          grid-template-columns: 1fr;
        }
        .ph {
          aspect-ratio: 16/9;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }

      /* LAKBAY visual refresh: warm archival browns, editorial rhythm, and clearer hierarchy */
      :root {
        --ivory: #f4ebdd;
        --green: #4b3024;
        --ink: #2b211b;
        --gray: #827163;
        --terra: #a65d3b;
        --paper: #e7d5be;
        --bg: #f4ebdd;
        --fg: #2b211b;
        --card: #e7d5be;
        --espresso: #2b211b;
        --coffee: #4b3024;
        --clay: #a65d3b;
        --sand: #d6bfa3;
        --line: #c8b49d;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #211913;
          --fg: #f4ebdd;
          --card: #39281e;
          --gray: #c0aa93;
          --terra: #d28a62;
          --green: #4b3024;
          --ivory: #f4ebdd;
        }
      }
      :root[data-theme="dark"] {
        --bg: #211913;
        --fg: #f4ebdd;
        --card: #39281e;
        --gray: #c0aa93;
        --terra: #d28a62;
        --green: #4b3024;
        --ivory: #f4ebdd;
      }
      body {
        font-size: 16px;
        line-height: 1.72;
        background-color: var(--bg);
        background-image: radial-gradient(#7b5c4310 0.75px, transparent 0.75px);
        background-size: 6px 6px;
      }
      header {
        padding: 13px max(5vw, 22px);
        background: color-mix(in srgb, var(--bg) 94%, transparent);
        backdrop-filter: blur(14px);
        .mark {
          font-size: 36px;
          font-weight: 600;
          letter-spacing: 0.17em;
          line-height: 1.1;
          color: var(--coffee);
        }

        .mark small {
          display: block;
          font-size: 11px;
          font-weight: 400;
          text-transform: uppercase;
          letter-spacing: 0.12em;
          margin-top: 5px;
          color: var(--gray);
        }

        border-bottom: 1px solid var(--line);
        box-shadow: 0 3px 18px #2b211b08;
      }
      .mark {
        font-size: 30px;
        letter-spacing: 0.17em;
        color: var(--coffee);
      }
      .mark small {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-top: 2px;
        color: var(--gray);
      }
      .btn {
        border: 1px solid var(--line);
        padding: 9px 17px;
        transition:
          background 0.2s,
          color 0.2s,
          border-color 0.2s;
      }
      .btn:hover,
      .btn.on {
        background: var(--coffee);
        border-color: var(--coffee);
        color: var(--ivory);
      }
      .btn.pri {
        background: var(--clay);
        border-color: var(--clay);
        color: #fff8ee;
        box-shadow: 0 5px 0 #6f3e2a18;
      }
      .btn.pri:hover {
        background: var(--coffee);
        border-color: var(--coffee);
        transform: translateY(-1px);
      }
      #prog {
        height: 3px;
        background: var(--clay);
      }
      #menu {
        background: var(--bg);
      }
      #menu a {
        border-color: var(--line);
      }
      #menu a:hover,
      #menu a.cur {
        color: var(--clay);
      }
      main {
        max-width: 1200px;
        padding-left: 6vw;
        padding-right: 6vw;
      }
      .hero {
        grid-template-columns: 1.15fr 0.85fr;
        gap: 7vw;
        padding: clamp(50px, 8vh, 100px) 0 76px;
        align-items: center;
        position: relative;
      }
      .hero:after {
        content: "A LIFE IN CHAPTERS";
        position: absolute;
        right: 0;
        bottom: 27px;
        font-size: 10px;
        letter-spacing: 0.22em;
        color: var(--gray);
      }
      .hero .small {
        font-size: 11px;
        letter-spacing: 0.17em;
        text-transform: uppercase;
        color: var(--clay);
        font-weight: 700;
        margin-bottom: 18px;
      }
      .hero h1 {
        font-size: clamp(65px, 10vw, 132px);
        line-height: 0.84;
        letter-spacing: 0.025em;
        color: var(--coffee);
        margin-bottom: 24px;
      }
      .hero-period {
        color: var(--clay);
      }
      .sub {
        font-size: clamp(25px, 3vw, 38px);
        line-height: 1.12;
        max-width: 30ch;
        color: var(--espresso);
      }
      .hero > div > p:not(.small):not(.sub) {
        max-width: 43ch;
        color: var(--gray);
        margin: 20px 0 26px;
      }
      .hero-art {
        margin: 0;
        max-width: 460px;
        justify-self: end;
        width: 100%;
        position: relative;
      }
      .portrait-frame {
        position: relative;
        padding: 12px 12px 35px;
        background: #e4d0b6;
        border: 1px solid #bda084;
        box-shadow: 10px 12px 0 #4b302411;
        transform: rotate(1.2deg);
      }
      .portrait-frame:before {
        content: "";
        position: absolute;
        inset: 6px;
        border: 1px solid #bda084;
        pointer-events: none;
        z-index: 1;
      }
      .portrait-frame img {
        display: block;
        width: 100%;
        height: clamp(300px, 39vw, 490px);
        object-fit: cover;
        object-position: 50% 22%;
        filter: sepia(0.23) contrast(0.96);
        background: #c8ae8d;
      }
      .portrait-fallback {
        height: clamp(300px, 39vw, 490px);
        place-items: center;
        text-align: center;
        background: linear-gradient(145deg, #d8c0a0, #9c7959);
        color: #4b3024;
        font:
          700 26px "Cormorant Garamond",
          serif;
        letter-spacing: 0.1em;
      }
      .portrait-fallback small {
        font-size: 14px;
        letter-spacing: 0.2em;
      }
      .image-stamp {
        position: absolute;
        bottom: 15px;
        right: 18px;
        font-size: 8px;
        letter-spacing: 0.16em;
        color: #70533d;
      }
      .hero-art figcaption {
        display: flex;
        justify-content: space-between;
        padding: 16px 3px 0;
        font:
          italic 17px "Cormorant Garamond",
          serif;
        color: var(--gray);
      }
      h2 {
        font-size: clamp(37px, 5vw, 61px);
        letter-spacing: -0.025em;
        color: var(--coffee);
        margin: 60px 0 22px;
      }
      h3 {
        color: var(--coffee);
        font-size: 29px;
        margin: 28px 0 8px;
      }
      .path {
        border-left: 1px solid var(--sand);
        margin-left: 10px;
        padding-left: clamp(18px, 4vw, 48px);
        position: relative;
      }
      .path:before {
        content: "";
        position: absolute;
        top: 0;
        left: -4px;
        width: 7px;
        height: 7px;
        background: var(--clay);
        border-radius: 50%;
      }
      .tl {
        gap: 8px;
        border-color: var(--line);
        padding: 12px 0;
      }
      .tl button,
      .tabs button {
        padding: 11px 15px;
        color: var(--gray);
        border-bottom-width: 2px;
      }
      .tl button[aria-pressed="true"],
      .tabs button[aria-pressed="true"] {
        color: var(--clay);
        border-color: var(--clay);
      }
      .panel {
        background: color-mix(in srgb, var(--card) 72%, var(--bg));
        padding: clamp(20px, 3vw, 30px);
        margin: 20px 0;
        border-left: 3px solid var(--clay);
        box-shadow: 0 5px 20px #4b302408;
      }
      .panel h3 {
        margin-top: 0;
      }
      .panel p:last-child {
        margin-bottom: 0;
      }
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
        gap: 0 26px;
        border-color: var(--line);
      }
      .grid a {
        padding: 24px 8px 24px 0;
        border-color: var(--line);
        transition:
          padding 0.2s,
          color 0.2s;
      }
      .grid a:hover {
        padding-left: 8px;
      }
      .grid h3 {
        font-size: 29px;
        line-height: 1.05;
        margin: 7px 0 0;
      }
      .grid small {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--clay);
      }
      .lede {
        font-size: clamp(24px, 3vw, 33px);
        color: var(--coffee);
        max-width: 32ch;
      }
      .cols {
        column-gap: clamp(28px, 5vw, 70px);
      }
      .sec {
        padding-bottom: 12px;
      }
      .sec h3 {
        font-size: 27px;
      }
      .sec p {
        margin-top: 7px;
      }
      details {
        border: 1px solid var(--line);
        padding: 15px 19px;
        margin: 28px 0;
        background: #d9c2a414;
      }
      summary {
        color: var(--coffee);
      }
      textarea {
        background: color-mix(in srgb, var(--bg) 75%, white);
        border-color: var(--line);
        border-radius: 0;
        min-height: 140px;
      }
      textarea:focus {
        outline-color: var(--clay);
      }
      .chain {
        gap: 7px;
      }
      .chain button {
        border-color: var(--line);
        padding: 8px 14px;
      }
      .chain button[aria-pressed="true"] {
        background: var(--coffee);
        border-color: var(--coffee);
        color: var(--ivory);
      }
      .nav2 {
        border-color: var(--line);
        padding-top: 24px;
      }
      .nav2 .btn.pri {
        color: #fff8ee;
      }
      .src li {
        padding: 0 0 12px;
        border-bottom: 1px solid var(--line);
      }
      a {
        color: var(--clay);
      }
      a:hover {
        color: var(--coffee);
      }
      #top {
        background: var(--coffee);
        box-shadow: 0 5px 20px #2b211b25;
      }
      @media (max-width: 760px) {
        main {
          padding-left: 6vw;
          padding-right: 6vw;
        }
        .hero {
          gap: 38px;
          padding-top: 50px;
          padding-bottom: 68px;
        }
        .hero:after {
          bottom: 23px;
          font-size: 9px;
        }
        .hero h1 {
          font-size: clamp(65px, 17vw, 104px);
        }
        .portrait-frame img,
        .portrait-fallback {
          height: clamp(260px, 75vw, 390px);
        }
        .hero-art {
          justify-self: start;
          max-width: 440px;
          width: 92%;
          margin-left: 4%;
        }
        h2 {
          margin-top: 48px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .grid a {
          padding: 20px 0;
        }
        .path {
          padding-left: 20px;
        }
        .tl {
          gap: 2px;
        }
        .tl button {
          padding: 9px 11px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .hero-art {
          animation: arrive 0.7s ease-out both;
        }
        @keyframes arrive {
          from {
            opacity: 0;
            transform: translateY(12px) rotate(0);
          }
          to {
            opacity: 1;
            transform: translateY(0) rotate(0);
          }
        }
        .grid a {
          transition:
            padding 0.18s ease,
            color 0.18s ease;
        }
      }
      /* Chapters button */
      #mb {
        background: #4b3024;
        color: #f4ebdd;
        border-color: #4b3024;
      }

      #mb:hover {
        background: #a65d3b;
        color: #ffffff;
        border-color: #a65d3b;
      }

      /* Field Note (replaces the old Reflect panel) */
      .archive-note {
        position: relative;
        margin: 34px 0;
        padding: 22px 22px 22px 27px;
        background: linear-gradient(120deg, #e8d4bc, #f0e4d3 72%, #e5ceb3);
        border: 1px solid #d0b496;
        box-shadow: 5px 6px 0 #5a3a2310;
      }
      .archive-note:before {
        content: "";
        position: absolute;
        left: 12px;
        top: 0;
        bottom: 0;
        width: 1px;
        background: #b98764;
      }
      .archive-note-label {
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 700;
        color: #9b5d3d;
      }
      .archive-note p {
        font: italic 19px/1.5 "Cormorant Garamond", Georgia, serif;
        color: #5b3d2b;
        margin: 9px 0 0;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .archive-note {
          background: linear-gradient(120deg, #39281e, #46332a);
          border-color: #5a4334;
          box-shadow: 5px 6px 0 #0000001a;
        }
        :root:not([data-theme="light"]) .archive-note:before {
          background: #8a6249;
        }
        :root:not([data-theme="light"]) .archive-note-label {
          color: #d5a57f;
        }
        :root:not([data-theme="light"]) .archive-note p {
          color: #f4ebdd;
        }
      }

          (document.getElementById("top").style.display =
            scrollY > 600 ? "block" : "none"),
      );
      route();
    </script>
  </body>
</html>
